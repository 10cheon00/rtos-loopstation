# Keep debugger/control and raw RTT sockets local; only the IP bridge is LAN-facing.
bindto 127.0.0.1
gdb_port disabled
tcl_port disabled
telnet_port disabled
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32h7x.cfg]
adapter speed 4000
init
if {[info exists FIRMWARE]} {
    program $FIRMWARE verify
}
# Reset exactly once after programming (or when attaching without --flash).
# Firmware must complete SEGGER_SYSVIEW_Conf before discovery.
reset run
sleep 1000
rtt setup 0x38000000 0x10000 "SEGGER RTT"
rtt polling_interval 1
rtt start
rtt server start 19021 1
